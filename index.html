<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catatan Keuangan</title>
<style>
  :root{
    --bg:#12141c; --surface:#1b1e29; --surface2:#20242f; --line:#2a2f3d;
    --text:#f0f1f5; --muted:#8a90a3; --accent:#3b82f6; --accent-dark:#2563eb;
    --green:#22c55e; --red:#ef4444; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  #app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
  #screen-content{flex:1;padding:16px 14px 90px;overflow-y:auto;}

  h1,h2,h3{margin:0;}
  .top-title{text-align:center;margin-bottom:2px;}
  .top-title h2{font-size:17px;font-weight:700;}
  .sub{color:var(--muted);font-size:12.5px;text-align:center;margin-bottom:14px;}

  .summary-row{display:flex;gap:8px;margin-bottom:16px;}
  .summary-card{flex:1;background:var(--surface);border-radius:var(--radius);padding:10px 8px;text-align:center;}
  .summary-card .label{font-size:11px;color:var(--muted);}
  .summary-card .value{font-size:13.5px;font-weight:700;margin-top:4px;}
  .val-green{color:var(--green);}
  .val-red{color:var(--red);}
  .val-white{color:var(--text);}

  .date-group{margin-bottom:14px;}
  .date-header{display:flex;justify-content:space-between;align-items:center;
    font-size:12.5px;color:var(--muted);font-weight:600;margin:14px 0 8px;}
  .date-header .net{font-weight:700;}

  .tx-item{display:flex;align-items:center;gap:10px;background:var(--surface);
    border-radius:12px;padding:10px;margin-bottom:8px;}
  .tx-icon{width:38px;height:38px;border-radius:10px;background:var(--surface2);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .tx-meta{flex:1;min-width:0;}
  .tx-name{font-size:13.5px;font-weight:600;}
  .tx-note{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-amount{font-size:13px;font-weight:700;flex-shrink:0;}
  .tx-del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 6px;}
  .tx-del:hover{color:var(--red);}

  .empty-state{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;}

  .month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;}
  .month-nav button{background:var(--surface);border:none;color:var(--text);
    width:32px;height:32px;border-radius:8px;font-size:15px;cursor:pointer;}
  .month-nav .month-label{font-size:14.5px;font-weight:700;min-width:130px;text-align:center;}

  .saldo-header{text-align:center;margin-bottom:6px;}
  .saldo-header .label{font-size:12px;color:var(--muted);}
  .saldo-header .amount{font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;}
  .saldo-header .edit-btn{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;}

  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
  .cat-card{background:var(--surface);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;}
  .cat-icon{width:36px;height:36px;border-radius:10px;background:var(--surface2);
    display:flex;align-items:center;justify-content:center;font-size:17px;}
  .cat-name{font-size:11.5px;font-weight:600;}
  .cat-amount{font-size:10.5px;color:var(--red);}
  .cat-amount.zero{color:var(--muted);}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .stat-card{background:var(--surface);border-radius:var(--radius);padding:12px;}
  .stat-card .icon{font-size:16px;}
  .stat-card .label{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .stat-card .value{font-size:15px;font-weight:700;margin-top:2px;}

  .export-btn{display:block;width:100%;background:var(--green);color:#08210f;border:none;
    border-radius:10px;padding:11px;font-size:13.5px;font-weight:700;text-align:center;
    text-decoration:none;margin-bottom:16px;cursor:pointer;}

  .progress-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:16px;}
  .progress-card .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px;}
  .progress-card .row .pct{color:var(--green);}
  .progress-track{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);border-radius:6px;}
  .progress-hint{font-size:11px;color:var(--muted);margin-top:6px;}

  .section-title{font-size:14px;font-weight:700;margin:6px 0 10px;}
  .kat-bar-item{margin-bottom:14px;}
  .kat-bar-top{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .kat-bar-top .name{font-weight:600;display:flex;align-items:center;gap:6px;}
  .kat-bar-top .amount{color:var(--red);font-weight:700;}
  .kat-bar-track{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;}
  .kat-bar-fill{height:100%;background:var(--red);border-radius:4px;}
  .kat-bar-pct{font-size:10.5px;color:var(--muted);margin-top:3px;text-align:right;}

  .profile-card{background:var(--surface);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:16px;}
  .profile-avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 10px;}
  .profile-name{font-size:16px;font-weight:700;}
  .profile-name input{background:none;border:none;color:var(--text);font-size:16px;font-weight:700;
    text-align:center;border-bottom:1px dashed var(--line);width:80%;}

  .settings-list{background:var(--surface);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
    border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .left{display:flex;align-items:center;gap:10px;}
  .settings-row .chev{color:var(--muted);}
  .settings-row input{background:none;border:none;color:var(--accent);font-weight:700;
    text-align:right;font-size:13.5px;width:110px;}

  .bottom-nav{display:flex;align-items:center;justify-content:space-evenly;
    background:var(--surface);height:68px;position:sticky;bottom:0;
    border-top:1px solid var(--line);}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:none;color:var(--muted);font-size:10px;font-weight:600;
    cursor:pointer;padding:6px 10px;border-radius:10px;}
  .nav-item .icon{font-size:19px;}
  .nav-item.active{color:var(--accent);}
  .fab{width:50px;height:50px;border-radius:50%;background:var(--accent);border:none;
    color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .fab:hover{background:var(--accent-dark);}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;
    align-items:flex-end;justify-content:center;z-index:100;}
  .modal-overlay.hidden{display:none;}
  .modal{width:100%;max-width:460px;background:var(--surface);border-radius:20px 20px 0 0;
    padding:18px 16px 22px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:16px;margin-bottom:14px;}
  .type-toggle{display:flex;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:14px;}
  .type-toggle button{flex:1;padding:9px;border:none;background:none;color:var(--muted);
    border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
  .type-toggle button.active-expense{background:var(--red);color:#fff;}
  .type-toggle button.active-income{background:var(--green);color:#08210f;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;background:var(--surface2);
    border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 11px;
    font-size:14px;font-family:inherit;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);}

  .cat-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:180px;overflow-y:auto;}
  .cat-pick{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;
    border-radius:10px;background:var(--surface2);cursor:pointer;font-size:10px;font-weight:600;
    border:2px solid transparent;}
  .cat-pick.selected{border-color:var(--accent);}
  .cat-pick .ic{font-size:16px;}

  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-cancel{background:var(--surface2);color:var(--text);}
  .btn-save{background:var(--accent);color:#fff;}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
    background:#000;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .loading{text-align:center;color:var(--muted);padding:60px 0;font-size:13px;}

  /* Layar setup URL backend (khusus versi GitHub Pages) */
  .setup-screen{max-width:420px;margin:60px auto;padding:0 20px;text-align:center;}
  .setup-screen h2{font-size:18px;margin-bottom:8px;}
  .setup-screen p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:18px;}
  .setup-screen input{width:100%;background:var(--surface2);border:1px solid var(--line);
    color:var(--text);border-radius:9px;padding:11px;font-size:13px;margin-bottom:12px;}
  .setup-screen button{width:100%;background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;}
  .setup-error{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;}
</style>
</head>
<body>

<div id="setup-screen" class="setup-screen hidden">
  <h2>⚙️ Hubungkan ke Backend</h2>
  <p>
    Tempel URL <b>Web App</b> hasil deploy Google Apps Script Anda di bawah ini.
    URL biasanya berbentuk:<br>
    <code>https://script.google.com/macros/s/xxxxx/exec</code>
  </p>
  <input type="text" id="setup-url" placeholder="https://script.google.com/macros/s/.../exec">
  <button id="setup-save">Simpan &amp; Mulai</button>
  <div class="setup-error" id="setup-error"></div>
</div>

<div id="app" class="hidden">
  <div id="screen-content">
    <div class="loading">Memuat data…</div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item" data-screen="akun"><span class="icon">👤</span>Akun</button>
    <button class="nav-item" data-screen="kategori"><span class="icon">🏷️</span>Kategori</button>
    <button class="fab" id="fab-add">+</button>
    <button class="nav-item" data-screen="operasi"><span class="icon">📋</span>Operasi</button>
    <button class="nav-item" data-screen="statistik"><span class="icon">📊</span>Statistik</button>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <h3>Tambah Transaksi</h3>
    <div class="type-toggle">
      <button id="type-pengeluaran" class="active-expense">Pengeluaran</button>
      <button id="type-pemasukan">Pemasukan</button>
    </div>
    <div class="field">
      <label>Jumlah (Rp)</label>
      <input type="text" id="f-jumlah" placeholder="0" inputmode="numeric">
    </div>
    <div class="field">
      <label>Kategori</label>
      <div class="cat-picker" id="cat-picker"></div>
    </div>
    <div class="field">
      <label>Catatan</label>
      <input type="text" id="f-catatan" placeholder="mis. potong rambut">
    </div>
    <div class="field">
      <label>Tanggal</label>
      <input type="date" id="f-tanggal">
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="btn-cancel">Batal</button>
      <button class="btn btn-save" id="btn-save">Simpan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   KONEKSI KE BACKEND (Google Apps Script)
   Ganti null di bawah dengan URL Web App Anda jika ingin "hardcode"
   langsung di kode (opsional). Kalau dibiarkan null, pengguna akan
   diminta memasukkan URL-nya saat pertama kali membuka halaman, dan
   akan disimpan otomatis di browser mereka (localStorage).
=================================================================== */
const HARDCODED_APPS_SCRIPT_URL = null; // contoh: 'https://script.google.com/macros/s/AKfycb.../exec'

let APPS_SCRIPT_URL = HARDCODED_APPS_SCRIPT_URL || localStorage.getItem('apps_script_url') || '';

function callApi(action, params) {
  const url = APPS_SCRIPT_URL + '?action=' + encodeURIComponent(action) +
    '&params=' + encodeURIComponent(JSON.stringify(params || {}));
  return fetch(url).then(res => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(data => {
    if (data && data.error) throw new Error(data.error);
    return data;
  });
}

// ---------- setup layar awal ----------
function initSetupOrApp(){
  if (APPS_SCRIPT_URL) {
    document.getElementById('app').classList.remove('hidden');
    startApp();
  } else {
    document.getElementById('setup-screen').classList.remove('hidden');
    document.getElementById('setup-save').addEventListener('click', () => {
      const val = document.getElementById('setup-url').value.trim();
      const err = document.getElementById('setup-error');
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(val)) {
        err.textContent = 'URL sepertinya tidak valid. Pastikan diakhiri dengan /exec';
        return;
      }
      localStorage.setItem('apps_script_url', val);
      APPS_SCRIPT_URL = val;
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      startApp();
    });
  }
}

const MONTH_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

const APP = {
  data: null,
  screen: 'operasi',
  viewBulan: null,
  monthCache: {},
  txType: 'Pengeluaran',
  selectedCategory: null,
};

// ---------- util ----------
function rp(n){
  const v = Math.round(Number(n) || 0);
  return new Intl.NumberFormat('id-ID').format(v) + ' Rp';
}
function rpSigned(n){
  const v = Math.round(Number(n) || 0);
  const sign = v > 0 ? '+' : (v < 0 ? '-' : '');
  return sign + new Intl.NumberFormat('id-ID').format(Math.abs(v)) + ' Rp';
}
// Ambil hanya digit dari input jumlah (buang titik pemisah ribuan, dll)
function parseJumlahInput(str){
  const digits = String(str || '').replace(/\D/g, '');
  return digits ? Number(digits) : 0;
}
// Format input jumlah dengan pemisah ribuan sambil diketik, tetap mempertahankan posisi kursor
function formatJumlahInputLive(e){
  const input = e.target;
  const prevLength = input.value.length;
  const prevPos = input.selectionStart;
  const digitsBeforeCursor = input.value.slice(0, prevPos).replace(/\D/g, '').length;

  const digits = input.value.replace(/\D/g, '');
  const formatted = digits ? new Intl.NumberFormat('id-ID').format(Number(digits)) : '';
  input.value = formatted;

  // Hitung ulang posisi kursor berdasarkan jumlah digit sebelum kursor
  let seen = 0, newPos = formatted.length;
  for (let i = 0; i < formatted.length; i++) {
    if (/\d/.test(formatted[i])) seen++;
    if (seen === digitsBeforeCursor) { newPos = i + 1; break; }
  }
  if (digitsBeforeCursor === 0) newPos = 0;
  input.setSelectionRange(newPos, newPos);
}
function monthLabel(bulan){
  const [y, m] = bulan.split('-').map(Number);
  return MONTH_NAMES[m - 1] + ' ' + y;
}
function shiftMonth(bulan, delta){
  const [y, m] = bulan.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function dateLabel(iso){
  const [y, m, d] = iso.split('-').map(Number);
  return String(d).padStart(2,'0') + ' ' + MONTH_NAMES[m - 1] + ' ' + y;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstChild;
}
function escapeHtml(s){
  return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Tanggal lokal hari ini dalam format yyyy-MM-dd. Jangan pakai toISOString()
// di sini karena itu mengembalikan tanggal UTC, yang bisa mundur 1 hari
// dibanding tanggal lokal (mis. jam 00:00-08:59 WIT).
function todayLocalISO(){
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

// ---------- load ----------
function startApp(){
  document.getElementById('screen-content').innerHTML = '<div class="loading">Memuat data…</div>';
  callApi('getInitialData').then(onInitialLoad).catch(onLoadError);
  bindNav();
  bindModal();
}

function onLoadError(err){
  document.getElementById('screen-content').innerHTML =
    '<div class="loading">Gagal memuat data: ' + (err.message || err) + '<br><br>' +
    '<button id="reset-url" style="background:var(--surface2);color:var(--text);border:none;padding:8px 14px;border-radius:8px;cursor:pointer;">Ganti URL Backend</button></div>';
  const btn = document.getElementById('reset-url');
  if (btn) btn.addEventListener('click', () => {
    localStorage.removeItem('apps_script_url');
    location.reload();
  });
}

function onInitialLoad(data){
  APP.data = data;
  APP.viewBulan = data.bulan;
  APP.monthCache[data.bulan] = { transaksi: data.transaksi, statistik: data.statistik };
  render();
}

function ensureMonth(bulan, cb){
  if (APP.monthCache[bulan]) { cb(APP.monthCache[bulan]); return; }
  callApi('getMonthData', { bulan }).then(res => {
    APP.monthCache[bulan] = res;
    cb(res);
  }).catch(err => toast('Gagal memuat bulan: ' + err.message));
}

function invalidateMonth(bulan){
  delete APP.monthCache[bulan];
}

function refreshSaldo(cb){
  callApi('getSaldoKeseluruhan').then(v => {
    APP.data.saldoKeseluruhan = v;
    if (cb) cb(v);
  });
}

// ---------- nav ----------
function bindNav(){
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      APP.screen = btn.dataset.screen;
      render();
    });
  });
  document.getElementById('fab-add').addEventListener('click', () => openModal());
}

function render(){
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.screen === APP.screen);
  });
  const c = document.getElementById('screen-content');
  c.innerHTML = '<div class="loading">Memuat…</div>';
  if (APP.screen === 'operasi') renderOperasi(c);
  else if (APP.screen === 'kategori') renderKategori(c);
  else if (APP.screen === 'statistik') renderStatistik(c);
  else if (APP.screen === 'akun') renderAkun(c);
}

// ---------- OPERASI ----------
function renderOperasi(c){
  ensureMonth(APP.data.bulan, ({ transaksi, statistik }) => {
    const groups = {};
    const order = [];
    transaksi.forEach(t => {
      if (!groups[t.tanggal]) { groups[t.tanggal] = []; order.push(t.tanggal); }
      groups[t.tanggal].push(t);
    });

    let rowsHtml = '';
    if (order.length === 0) {
      rowsHtml = '<div class="empty-state">Belum ada transaksi bulan ini.<br>Tekan tombol + untuk menambah.</div>';
    } else {
      order.forEach(dateIso => {
        const items = groups[dateIso];
        const net = items.reduce((s, t) => s + (t.tipe === 'Pemasukan' ? t.jumlah : -t.jumlah), 0);
        rowsHtml += `<div class="date-group">
          <div class="date-header"><span>${dateLabel(dateIso)}</span>
            <span class="net ${net < 0 ? 'val-red' : 'val-green'}">${rpSigned(net)}</span></div>`;
        items.forEach(t => {
          const cat = APP.data.kategori.find(k => k.nama === t.kategori);
          const icon = cat ? cat.icon : '🔖';
          const amt = t.tipe === 'Pemasukan' ? '+' + rp(t.jumlah) : '-' + rp(t.jumlah);
          rowsHtml += `<div class="tx-item">
            <div class="tx-icon">${icon}</div>
            <div class="tx-meta">
              <div class="tx-name">${escapeHtml(t.kategori)}</div>
              <div class="tx-note">${escapeHtml(t.catatan || '')}</div>
            </div>
            <div style="text-align:right">
              <div class="tx-amount ${t.tipe === 'Pemasukan' ? 'val-green' : 'val-red'}">${amt}</div>
            </div>
            <button class="tx-del" data-id="${t.id}" title="Hapus">🗑</button>
          </div>`;
        });
        rowsHtml += `</div>`;
      });
    }

    c.innerHTML = `
      <div class="top-title"><h2>Riwayat Transaksi</h2></div>
      <div class="sub">${monthLabel(APP.data.bulan)}</div>
      <div class="summary-row">
        <div class="summary-card"><div class="label">Pemasukan</div><div class="value val-green">${rp(statistik.pemasukan)}</div></div>
        <div class="summary-card"><div class="label">Pengeluaran</div><div class="value val-red">${rp(statistik.pengeluaran)}</div></div>
        <div class="summary-card"><div class="label">Saldo</div><div class="value val-white">${rp(statistik.saldoKeseluruhan)}</div></div>
      </div>
      ${rowsHtml}
    `;

    c.querySelectorAll('.tx-del').forEach(b => {
      b.addEventListener('click', () => {
        if (!confirm('Hapus transaksi ini?')) return;
        callApi('deleteTransaction', { id: b.dataset.id }).then(() => {
          invalidateMonth(APP.data.bulan);
          invalidateMonth(APP.viewBulan);
          toast('Transaksi dihapus');
          render();
        });
      });
    });
  });
}

// ---------- KATEGORI ----------
function renderKategori(c){
  ensureMonth(APP.viewBulan, ({ statistik }) => {
    const perKat = {};
    statistik.perKategori.forEach(k => perKat[k.kategori] = k.jumlah);
    const expenseCats = APP.data.kategori.filter(k => k.tipe === 'Pengeluaran');

    c.innerHTML = `
      <div class="saldo-header">
        <div class="label">Saldo keseluruhan</div>
        <div class="amount">${rp(APP.data.saldoKeseluruhan)} <button class="edit-btn" id="edit-saldo">✎</button></div>
      </div>
      <div class="month-nav">
        <button id="mnav-prev">‹</button>
        <div class="month-label">${monthLabel(APP.viewBulan)}</div>
        <button id="mnav-next">›</button>
      </div>
      <div class="summary-row">
        <div class="summary-card"><div class="label">Pengeluaran</div><div class="value val-red">${rp(statistik.pengeluaran)}</div></div>
        <div class="summary-card"><div class="label">Pendapatan</div><div class="value val-green">${rp(statistik.pemasukan)}</div></div>
      </div>
      <div class="cat-grid" id="cat-grid"></div>
    `;

    const grid = document.getElementById('cat-grid');
    expenseCats.forEach(k => {
      const amt = perKat[k.nama] || 0;
      const card = el(`<div class="cat-card">
        <div class="cat-icon">${k.icon}</div>
        <div class="cat-name">${escapeHtml(k.nama)}</div>
        <div class="cat-amount ${amt === 0 ? 'zero' : ''}">${rp(amt)}</div>
      </div>`);
      card.addEventListener('click', () => openModal({ tipe: 'Pengeluaran', kategori: k.nama }));
      grid.appendChild(card);
    });

    document.getElementById('edit-saldo').addEventListener('click', () => {
      const v = prompt('Saldo awal (angka):', APP.data.saldoAwal);
      if (v === null) return;
      callApi('updateSaldoAwal', { value: v }).then(saldo => {
        APP.data.saldoAwal = Number(v) || 0;
        APP.data.saldoKeseluruhan = saldo;
        toast('Saldo awal diperbarui');
        render();
      });
    });
    document.getElementById('mnav-prev').addEventListener('click', () => { APP.viewBulan = shiftMonth(APP.viewBulan, -1); render(); });
    document.getElementById('mnav-next').addEventListener('click', () => { APP.viewBulan = shiftMonth(APP.viewBulan, 1); render(); });
  });
}

// ---------- STATISTIK ----------
function renderStatistik(c){
  ensureMonth(APP.viewBulan, ({ statistik }) => {
    const savingsPct = Math.max(0, Math.min(100, statistik.tingkatTabungan));
    let barsHtml = '';
    if (statistik.perKategori.length === 0) {
      barsHtml = '<div class="empty-state">Belum ada pengeluaran bulan ini.</div>';
    } else {
      statistik.perKategori.forEach(k => {
        const cat = APP.data.kategori.find(x => x.nama === k.kategori);
        const icon = cat ? cat.icon : '🔖';
        barsHtml += `<div class="kat-bar-item">
          <div class="kat-bar-top">
            <div class="name">${icon} ${escapeHtml(k.kategori)}</div>
            <div class="amount">${rp(k.jumlah)}</div>
          </div>
          <div class="kat-bar-track"><div class="kat-bar-fill" style="width:${k.persen}%"></div></div>
          <div class="kat-bar-pct">${k.persen.toFixed(1)}%</div>
        </div>`;
      });
    }

    c.innerHTML = `
      <div class="top-title"><h2>Statistik</h2></div>
      <div class="sub">${monthLabel(APP.viewBulan)}</div>
      <div class="month-nav">
        <button id="mnav-prev">‹</button>
        <div class="month-label">${monthLabel(APP.viewBulan)}</div>
        <button id="mnav-next">›</button>
      </div>
      <button class="export-btn" id="btn-export">📊 Ekspor ke Excel (.xlsx)</button>
      <div class="stat-grid">
        <div class="stat-card"><div class="icon">💰</div><div class="label">Total Pemasukan</div><div class="value val-green">${rp(statistik.pemasukan)}</div></div>
        <div class="stat-card"><div class="icon">📉</div><div class="label">Total Pengeluaran</div><div class="value val-red">${rp(statistik.pengeluaran)}</div></div>
        <div class="stat-card"><div class="icon">💼</div><div class="label">Saldo Bersih</div><div class="value val-white">${rp(statistik.saldoBersih)}</div></div>
        <div class="stat-card"><div class="icon">🐷</div><div class="label">Tingkat Tabungan</div><div class="value val-green">${statistik.tingkatTabungan.toFixed(1)}%</div></div>
      </div>
      <div class="progress-card">
        <div class="row"><span>Progres Tabungan</span><span class="pct">${statistik.tingkatTabungan.toFixed(0)}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${savingsPct}%"></div></div>
        <div class="progress-hint">Target ideal: hemat minimal 20% dari pemasukan</div>
      </div>
      <div class="section-title">Pengeluaran per Kategori</div>
      ${barsHtml}
    `;

    document.getElementById('mnav-prev').addEventListener('click', () => { APP.viewBulan = shiftMonth(APP.viewBulan, -1); render(); });
    document.getElementById('mnav-next').addEventListener('click', () => { APP.viewBulan = shiftMonth(APP.viewBulan, 1); render(); });
    document.getElementById('btn-export').addEventListener('click', () => {
      callApi('getExportUrl').then(url => window.open(url, '_blank'));
    });
  });
}

// ---------- AKUN ----------
function renderAkun(c){
  c.innerHTML = `
    <div class="top-title"><h2>Akun</h2></div>
    <div class="profile-card">
      <div class="profile-avatar">👤</div>
      <div class="profile-name"><input type="text" id="f-nama" value="${escapeHtml(APP.data.namaPengguna)}"></div>
    </div>
    <div class="settings-list">
      <div class="settings-row">
        <div class="left">💰 Saldo Awal</div>
        <input type="number" id="f-saldo-awal" value="${APP.data.saldoAwal}">
      </div>
      <div class="settings-row" id="row-kategori-baru">
        <div class="left">➕ Tambah Kategori Baru</div>
        <span class="chev">›</span>
      </div>
      <div class="settings-row" id="row-sheet">
        <div class="left">📄 Buka Spreadsheet Sumber Data</div>
        <span class="chev">›</span>
      </div>
      <div class="settings-row" id="row-ganti-url">
        <div class="left">🔗 Ganti URL Backend</div>
        <span class="chev">›</span>
      </div>
    </div>
    <div class="empty-state">Catatan Keuangan — Frontend GitHub Pages + Backend Google Apps Script</div>
  `;

  document.getElementById('f-nama').addEventListener('change', (e) => {
    callApi('updateNamaPengguna', { nama: e.target.value });
    APP.data.namaPengguna = e.target.value;
    toast('Nama diperbarui');
  });
  document.getElementById('f-saldo-awal').addEventListener('change', (e) => {
    callApi('updateSaldoAwal', { value: e.target.value }).then(saldo => {
      APP.data.saldoAwal = Number(e.target.value) || 0;
      APP.data.saldoKeseluruhan = saldo;
      toast('Saldo awal diperbarui');
    });
  });
  document.getElementById('row-kategori-baru').addEventListener('click', () => {
    const nama = prompt('Nama kategori baru:');
    if (!nama) return;
    const icon = prompt('Emoji ikon (mis. 🎯):', '🔖') || '🔖';
    const tipe = confirm('OK = Pengeluaran, Batal = Pemasukan') ? 'Pengeluaran' : 'Pemasukan';
    callApi('addCategory', { nama, icon, tipe }).then(list => {
      APP.data.kategori = list;
      toast('Kategori "' + nama + '" ditambahkan');
      render();
    });
  });
  document.getElementById('row-sheet').addEventListener('click', () => {
    callApi('getSheetUrl').then(url => window.open(url, '_blank'));
  });
  document.getElementById('row-ganti-url').addEventListener('click', () => {
    if (!confirm('Ganti URL backend? Anda perlu memasukkan URL baru.')) return;
    localStorage.removeItem('apps_script_url');
    location.reload();
  });
}

// ---------- MODAL TAMBAH TRANSAKSI ----------
function bindModal(){
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') closeModal();
  });
  document.getElementById('type-pengeluaran').addEventListener('click', () => setTxType('Pengeluaran'));
  document.getElementById('type-pemasukan').addEventListener('click', () => setTxType('Pemasukan'));
  document.getElementById('btn-save').addEventListener('click', saveTransaction);
  document.getElementById('f-jumlah').addEventListener('input', formatJumlahInputLive);
}

function openModal(preset){
  APP.txType = (preset && preset.tipe) || 'Pengeluaran';
  APP.selectedCategory = (preset && preset.kategori) || null;
  document.getElementById('f-jumlah').value = '';
  document.getElementById('f-catatan').value = '';
  document.getElementById('f-tanggal').value = todayLocalISO();
  renderTypeToggle();
  renderCatPicker();
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
}
function setTxType(tipe){
  APP.txType = tipe;
  APP.selectedCategory = null;
  renderTypeToggle();
  renderCatPicker();
}
function renderTypeToggle(){
  document.getElementById('type-pengeluaran').classList.toggle('active-expense', APP.txType === 'Pengeluaran');
  document.getElementById('type-pemasukan').classList.toggle('active-income', APP.txType === 'Pemasukan');
}
function renderCatPicker(){
  const picker = document.getElementById('cat-picker');
  picker.innerHTML = '';
  const list = APP.data.kategori.filter(k => k.tipe === APP.txType);
  list.forEach(k => {
    const card = el(`<div class="cat-pick ${APP.selectedCategory === k.nama ? 'selected' : ''}">
      <div class="ic">${k.icon}</div><div>${escapeHtml(k.nama)}</div>
    </div>`);
    card.addEventListener('click', () => {
      APP.selectedCategory = k.nama;
      renderCatPicker();
    });
    picker.appendChild(card);
  });
}
function saveTransaction(){
  const jumlah = parseJumlahInput(document.getElementById('f-jumlah').value);
  const catatan = document.getElementById('f-catatan').value;
  const tanggal = document.getElementById('f-tanggal').value;
  if (!jumlah || jumlah <= 0) { toast('Isi jumlah dengan benar'); return; }
  if (!APP.selectedCategory) { toast('Pilih kategori dulu'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Menyimpan…';

  callApi('addTransaction', {
    tipe: APP.txType,
    kategori: APP.selectedCategory,
    jumlah: jumlah,
    catatan: catatan,
    tanggal: tanggal,
  }).then(res => {
    invalidateMonth(res.bulan);
    invalidateMonth(APP.viewBulan);
    refreshSaldo(() => {
      closeModal();
      toast('Transaksi disimpan');
      render();
      btn.disabled = false; btn.textContent = 'Simpan';
    });
  }).catch(err => {
    toast('Gagal menyimpan: ' + (err.message || err));
    btn.disabled = false; btn.textContent = 'Simpan';
  });
}

// ---------- start ----------
window.addEventListener('DOMContentLoaded', initSetupOrApp);
</script>
